name: Omar Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Omar Gate — mirrors the fencesngates setup: a single job, one action call,
  # static Codex 5.3 inputs, general app-security (NO supply-chain spec_id).
  # Managed LLM when SENTINELAYER_TOKEN is provisioned, else BYOK repo OpenAI key.
  # Job name is "Omar Gate" to preserve the branch-protection required check.
  omar-gate:
    name: Omar Gate
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # required by sentinelayer-v1-action managed LLM (OIDC)
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Omar Gate — Sentinelayer Security Review
        id: omar
        uses: mrrCarter/sentinelayer-v1-action@8595c4ad41e7b710ff6b1de0603da6ad8c0c3c07 # v1.3.4
        with:
          github_token: ${{ github.token }}
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          sentinelayer_managed_llm: ${{ secrets.SENTINELAYER_TOKEN != '' }}
          severity_gate: P1
          scan_mode: deep
          model: gpt-5.3-codex
          model_fallback: gpt-5.3-codex
          use_codex: true
          codex_only: false
          codex_model: gpt-5.3-codex
          llm_failure_policy: block
          fork_policy: block

      - name: Enforce Omar Gate used Codex 5.3 LLM
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          pack_path = pathlib.Path("${{ steps.omar.outputs.pack_summary_artifact }}")
          if not pack_path.is_file():
              print(f"::error::Omar Gate PACK_SUMMARY not found: {pack_path}")
              sys.exit(1)

          summary = json.loads(pack_path.read_text(encoding="utf-8"))
          usage = summary.get("llm_usage") or {}
          model = str(usage.get("model") or "").strip()
          engine = str(usage.get("engine") or usage.get("provider") or "").strip()

          if model != "gpt-5.3-codex":
              print(
                  "::error::Omar Gate did not record gpt-5.3-codex LLM usage; "
                  f"engine={engine or 'none'} model={model or 'none'}"
              )
              sys.exit(1)

          print(f"Omar Gate LLM verified: engine={engine or 'llm'} model={model}")
          PY
